<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funboard — a fast make.fun frontend</title>
<meta name="description" content="Funboard: a fast, light, read-only frontend for make.fun. Live bounty board, bounty pages, leaderboards and profiles, straight from make.fun's public API.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/" aria-label="Funboard home">
    <span class="brand-mark" aria-hidden="true">🎯</span>
    <span class="brand-name">Funboard</span>
    <span class="brand-sub">a fast make.fun frontend</span>
  </a>
  <nav class="topnav" aria-label="Main">
